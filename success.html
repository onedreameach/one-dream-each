```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dream Claimed — One Dream Each</title>

  <meta
    name="description"
    content="Your dream has been claimed."
  >

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      --black: #050505;
      --white: #ffffff;
      --purple: #7c3aed;
      --purple-light: #a78bfa;
      --muted: #8b8b95;
      --line: rgba(255,255,255,.09);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--black);
      color: var(--white);
      font-family: Inter, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 700px;
      height: 700px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        circle,
        rgba(124,58,237,.16),
        transparent 65%
      );
      pointer-events: none;
    }

    .box {
      position: relative;
      z-index: 2;
      width: min(650px, 90%);
    }

    .logo {
      width: 48px;
      height: 48px;
      border: 1px solid rgba(167,139,250,.7);
      display: grid;
      place-items: center;
      margin: 0 auto 40px;
      color: var(--purple-light);
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      position: relative;
    }

    .logo::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--purple);
      border-radius: 50%;
      right: 6px;
      top: 6px;
      box-shadow: 0 0 18px var(--purple);
    }

    .eyebrow {
      color: var(--purple-light);
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 25px;
    }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(48px, 8vw, 82px);
      line-height: .95;
      letter-spacing: -4px;
    }

    h1 span {
      background: linear-gradient(
        90deg,
        #ffffff,
        #a78bfa,
        #7c3aed
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      margin: 30px auto 0;
      max-width: 500px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 45px;
      height: 58px;
      padding: 0 32px;
      background: white;
      color: #050505;
      text-decoration: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 800;
      transition: .25s ease;
    }

    .button:hover {
      transform: translateY(-3px);
      background: var(--purple-light);
      box-shadow: 0 15px 50px rgba(124,58,237,.25);
    }

    .small {
      margin-top: 25px;
      color: #55555d;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <main class="box">

    <div class="logo">
      1
    </div>

    <div class="eyebrow">
      Dream claimed
    </div>

    <h1>
      Your dream<br>
      <span>has a place.</span>
    </h1>

    <p>
      Thank you for leaving your dream with One Dream Each.
      Your place has been successfully claimed.
    </p>

    <a href="/" class="button">
      BACK TO ONE DREAM EACH
    </a>

    <div class="small">
      One place. One dream. Your words.
    </div>

  </main>

</body>
</html>
