<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- OneDreamEach Icons -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<link rel="manifest" href="/site.webmanifest">

<meta name="theme-color" content="#050505">
  <!-- One Dream Each favicon -->
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="shortcut icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dream — One Dream Each</title>

  <meta
    name="description"
    content="One dream. One place. One story."
  >

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      --black: #050505;
      --white: #ffffff;
      --purple: #7c3aed;
      --purple-light: #a78bfa;
      --muted: #8b8b95;
      --line: rgba(255,255,255,.09);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--black);
      color: var(--white);
      font-family: Inter, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 760px;
      height: 760px;
      left: 50%;
      top: 8%;
      transform: translateX(-50%);
      background: radial-gradient(
        circle,
        rgba(124,58,237,.14),
        transparent 66%
      );
      pointer-events: none;
      z-index: -1;
    }

    .container {
      width: min(1100px, 90%);
      margin: auto;
    }

    /* NAV */

    nav {
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .5px;
      color: var(--white);
      text-decoration: none;
    }

    .logo {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(167,139,250,.7);
      display: grid;
      place-items: center;
      color: var(--purple-light);
      font-weight: 700;
      position: relative;
    }

    .logo::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      background: var(--purple);
      border-radius: 50%;
      right: 5px;
      top: 5px;
      box-shadow: 0 0 15px var(--purple);
    }

    .back {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      transition: .2s ease;
    }

    .back:hover {
      color: var(--white);
    }

    /* MAIN */

    main {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 90px 0;
    }

    #content {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* DREAM CARD */

    .dream-card {
      width: min(780px, 100%);
      position: relative;
      text-align: center;
      padding: 72px 55px 58px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background:
        radial-gradient(
          circle at top right,
          rgba(124,58,237,.12),
          transparent 42%
        ),
        rgba(9,9,9,.90);
      box-shadow: 0 35px 110px rgba(0,0,0,.40);
      overflow: hidden;
    }

    .dream-card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(124,58,237,.06);
      filter: blur(35px);
      right: -50px;
      top: -50px;
      pointer-events: none;
    }

    .dream-label {
      color: #5f5f68;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .number {
      color: var(--purple-light);
      font-family: "Space Grotesk", sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 34px;
    }

    .nickname {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(42px, 7vw, 72px);
      line-height: .95;
      letter-spacing: -4px;
      margin-bottom: 18px;
      word-break: break-word;
    }

    .country {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 54px;
    }

    .quote-mark {
      font-family: "Space Grotesk", sans-serif;
      color: rgba(167,139,250,.35);
      font-size: 56px;
      line-height: .7;
      margin-bottom: 12px;
    }

    .dream {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(25px, 4vw, 42px);
      line-height: 1.25;
      letter-spacing: -1.3px;
      max-width: 650px;
      margin: auto;
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* AUTHOR SOCIALS */

    .author-socials {
      margin-top: 46px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .author-social {
      padding: 11px 17px;
      border: 1px solid var(--line);
      color: #d7d7dc;
      text-decoration: none;
      font-size: 11px;
      border-radius: 5px;
      transition: .2s ease;
    }

    .author-social:hover {
      color: var(--purple-light);
      border-color: rgba(167,139,250,.55);
      background: rgba(124,58,237,.06);
    }

    /* DIVIDER */

    .divider {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin: 52px 0 34px;
    }

    /* SHARE */

    .share-title {
      font-size: 10px;
      color: #666670;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .share-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .share-button {
      min-height: 44px;
      padding: 0 17px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--white);
      border-radius: 5px;
      font-family: Inter, sans-serif;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      transition: .2s ease;
    }

    .share-button:hover {
      color: var(--purple-light);
      border-color: rgba(167,139,250,.55);
      background: rgba(124,58,237,.06);
      transform: translateY(-2px);
    }

    .share-main {
      background: var(--white);
      color: var(--black);
      border-color: var(--white);
    }

    .share-main:hover {
      color: var(--black);
      background: var(--purple-light);
      border-color: var(--purple-light);
    }

    .copy-status {
      height: 18px;
      margin-top: 13px;
      color: var(--purple-light);
      font-size: 10px;
      letter-spacing: .5px;
    }

    .signature {
      margin-top: 28px;
      color: #55555d;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* LOADING / ERROR */

    .loading,
    .error-box {
      width: min(700px, 100%);
      text-align: center;
      padding: 70px 30px;
      border: 1px solid var(--line);
      background: #090909;
      border-radius: 8px;
    }

    .loading {
      color: var(--muted);
      font-size: 14px;
    }

    .error-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 30px;
      margin-bottom: 15px;
    }

    .error-text {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .error-link {
      color: var(--purple-light);
      text-decoration: none;
      font-size: 12px;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid var(--line);
      padding: 30px 0;
      text-align: center;
      color: #55555d;
      font-size: 12px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      nav {
        height: 72px;
      }

      .brand {
        font-size: 12px;
      }

      .back {
        font-size: 11px;
      }

      main {
        padding: 55px 0;
      }

      .dream-card {
        padding: 52px 23px 42px;
      }

      .nickname {
        font-size: 45px;
        letter-spacing: -2.5px;
      }

      .country {
        margin-bottom: 42px;
      }

      .dream {
        font-size: 26px;
      }

      .share-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .share-button {
        width: 100%;
      }

      .share-main {
        grid-column: 1 / -1;
      }
    }
  </style>
  <link rel="stylesheet" href="/ode-polish.css?v=2">
  <script src="/ode-countries.js?v=1"></script>
</head>

<body data-ode-page="dream">

  <div class="container">

    <nav>

      <a class="brand" href="/">
        <div class="logo">1</div>
        ONE DREAM EACH
      </a>

      <a class="back" href="/explore.html">
        ← Back to the wall
      </a>

    </nav>

    <main>

      <div id="content">

        <div class="loading">
          Loading dream...
        </div>

      </div>

    </main>

  </div>

  <footer class="dream-static-footer">
    <strong>ONE DREAM EACH · One million people. One million dreams.</strong>
    <nav aria-label="Legal"><a href="/terms.html">TERMS</a><a href="/privacy.html">PRIVACY</a><a href="/refund.html">REFUND</a><a href="/contact.html">CONTACT</a></nav>
  </footer>


  <script>

    let currentDream = null;


    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function cleanSocialUsername(value) {

      return String(value || "")
        .trim()
        .replace(/^@/, "");

    }


    function getDreamUrl() {

      return window.location.origin +
        window.location.pathname +
        window.location.search;

    }


    function getShareText() {

      if (!currentDream) {
        return "One dream. One place. One story.";
      }

      return (
        currentDream.nickname +
        " left dream #" +
        currentDream.dream_number +
        " on One Dream Each."
      );

    }


    async function copyDreamLink() {

      const status =
        document.getElementById(
          "copy-status"
        );

      try {

        await navigator.clipboard.writeText(
          getDreamUrl()
        );

        status.textContent =
          "Link copied.";

      }

      catch (error) {

        console.error(
          "Copy error:",
          error
        );

        status.textContent =
          "Unable to copy automatically.";

      }


      setTimeout(
        function() {

          status.textContent =
            "";

        },
        2500
      );

    }


    async function nativeShare() {

      const shareData = {
        title:
          document.title,

        text:
          getShareText(),

        url:
          getDreamUrl()
      };


      if (navigator.share) {

        try {

          await navigator.share(
            shareData
          );

        }

        catch (error) {

          if (
            error.name !==
            "AbortError"
          ) {

            console.error(
              "Share error:",
              error
            );

          }

        }

        return;

      }


      /*
       * Desktop fallback:
       * copy the link.
       */

      await copyDreamLink();

    }


    function shareWhatsApp() {

      const text =
        getShareText() +
        "\n" +
        getDreamUrl();


      const url =
        "https://wa.me/?text=" +
        encodeURIComponent(
          text
        );


      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );

    }


    function shareX() {

      const url =
        "https://twitter.com/intent/tweet?text=" +
        encodeURIComponent(
          getShareText()
        ) +
        "&url=" +
        encodeURIComponent(
          getDreamUrl()
        );


      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );

    }


    async function loadDream() {

      const content =
        document.getElementById(
          "content"
        );


      try {

        const params =
          new URLSearchParams(
            window.location.search
          );


        const number =
          params.get(
            "number"
          );


        if (!number) {

          throw new Error(
            "Dream number missing"
          );

        }


        /*
         * LOAD ONLY THIS DREAM
         */

        const response =
          await fetch(
            "/api/dream?number=" +
            encodeURIComponent(
              number
            ),
            {
              cache:
                "no-store"
            }
          );


        const dream =
          await response.json();


        if (!response.ok) {

          if (
            response.status === 404
          ) {

            content.innerHTML = `
              <div class="error-box">

                <div class="error-title">
                  Dream not found.
                </div>

                <div class="error-text">
                  This place doesn't seem to exist.
                </div>

                <a
                  class="error-link"
                  href="/explore.html"
                >
                  ← Return to the Dream Wall
                </a>

              </div>
            `;

            return;

          }


          throw new Error(
            dream.error ||
            "Unable to load dream"
          );

        }


        currentDream =
          dream;


        /*
         * PAGE TITLE
         */

        document.title =
          `Dream #${dream.dream_number} — One Dream Each`;


        /*
         * META DESCRIPTION
         */

        const metaDescription =
          document.querySelector(
            'meta[name="description"]'
          );


        if (metaDescription) {

          metaDescription.setAttribute(
            "content",
            String(
              dream.dream_text || ""
            ).slice(
              0,
              150
            )
          );

        }


        /*
         * INSTAGRAM
         */

        let instagramHtml =
          "";


        if (dream.instagram) {

          const username =
            cleanSocialUsername(
              dream.instagram
            );


          instagramHtml = `
            <a
              class="author-social"
              href="https://instagram.com/${encodeURIComponent(username)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Instagram ↗
            </a>
          `;

        }


        /*
         * TIKTOK
         */

        let tiktokHtml =
          "";


        if (dream.tiktok) {

          const username =
            cleanSocialUsername(
              dream.tiktok
            );


          tiktokHtml = `
            <a
              class="author-social"
              href="https://tiktok.com/@${encodeURIComponent(username)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              TikTok ↗
            </a>
          `;

        }


        /*
         * SOCIALS WRAPPER
         */

        const socialsHtml =
          instagramHtml ||
          tiktokHtml
            ? `
              <div class="author-socials">
                ${instagramHtml}
                ${tiktokHtml}
              </div>
            `
            : "";


        /*
         * RENDER DREAM
         */

        content.innerHTML = `

          <article class="dream-card">

            <div class="dream-label">
              ONE PLACE · ONE DREAM
            </div>

            <div class="number">
              DREAM #${String(
                dream.dream_number
              ).padStart(
                6,
                "0"
              )}
            </div>


            <div class="nickname">
              ${escapeHtml(
                dream.nickname ||
                "Anonymous"
              )}
            </div>


            <div class="country">
              ${escapeHtml(
                dream.country ||
                ""
              )}
            </div>


            <div class="quote-mark">
              “
            </div>


            <div class="dream">
              ${escapeHtml(
                dream.dream_text ||
                ""
              )}
            </div>


            ${socialsHtml}


            <div class="divider"></div>


            <div class="share-title">
              Share this dream
            </div>


            <div class="share-buttons">

              <button
                class="share-button share-main"
                type="button"
                id="native-share"
              >
                SHARE THIS DREAM
              </button>


              <button
                class="share-button"
                type="button"
                id="copy-link"
              >
                COPY LINK
              </button>


              <button
                class="share-button"
                type="button"
                id="share-whatsapp"
              >
                WHATSAPP
              </button>


              <button
                class="share-button"
                type="button"
                id="share-x"
              >
                X / TWITTER
              </button>

            </div>


            <div
              class="copy-status"
              id="copy-status"
            ></div>


            <div class="signature">
              One Dream Each · Your dream has a place.
            </div>

          </article>

        `;


        /*
         * BUTTON EVENTS
         */

        document
          .getElementById(
            "native-share"
          )
          .addEventListener(
            "click",
            nativeShare
          );


        document
          .getElementById(
            "copy-link"
          )
          .addEventListener(
            "click",
            copyDreamLink
          );


        document
          .getElementById(
            "share-whatsapp"
          )
          .addEventListener(
            "click",
            shareWhatsApp
          );


        document
          .getElementById(
            "share-x"
          )
          .addEventListener(
            "click",
            shareX
          );

      }


      catch (error) {

        console.error(
          "Dream page error:",
          error
        );


        content.innerHTML = `
          <div class="error-box">

            <div class="error-title">
              Unable to load this dream.
            </div>

            <div class="error-text">
              Please try again or return to the Dream Wall.
            </div>

            <a
              class="error-link"
              href="/explore.html"
            >
              ← Return to the Dream Wall
            </a>

          </div>
        `;

      }

    }


    loadDream();

  </script>

</body>
</html>
