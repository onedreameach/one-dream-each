<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>One Dream Each</title>

  <meta
    name="description"
    content="One million people. One million dreams. One place to leave them."
  >

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      --black: #050505;
      --white: #ffffff;
      --purple: #7c3aed;
      --purple-light: #a78bfa;
      --muted: #8b8b95;
      --line: rgba(255,255,255,.09);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: Inter, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 700px;
      height: 700px;
      left: 50%;
      top: 10%;
      transform: translateX(-50%);
      background: radial-gradient(
        circle,
        rgba(124,58,237,.12),
        transparent 65%
      );
      pointer-events: none;
      z-index: -1;
    }

    .container {
      width: min(1180px, 90%);
      margin: auto;
    }

    /* NAV */

    nav {
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      letter-spacing: .5px;
      font-size: 14px;
    }

    .logo {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(167,139,250,.7);
      display: grid;
      place-items: center;
      color: var(--purple-light);
      font-weight: 700;
      position: relative;
    }

    .logo::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      background: var(--purple);
      border-radius: 50%;
      right: 5px;
      top: 5px;
      box-shadow: 0 0 15px var(--purple);
    }

    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      transition: .2s ease;
    }

    .nav-link:hover {
      color: var(--white);
    }

    /* HERO */

    .hero {
      min-height: 760px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--purple-light);
      margin-bottom: 30px;
      font-weight: 600;
    }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(58px, 10vw, 125px);
      line-height: .9;
      letter-spacing: -6px;
      font-weight: 700;
      max-width: 1100px;
    }

    .question {
      background: linear-gradient(
        90deg,
        #ffffff 10%,
        #a78bfa 50%,
        #7c3aed 90%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-text {
      margin-top: 34px;
      max-width: 560px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    /* COUNTER */

    .counter-box {
      margin-top: 55px;
      width: min(600px, 90%);
    }

    .counter {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(45px, 7vw, 80px);
      font-weight: 700;
      letter-spacing: -4px;
    }

    .counter-label {
      color: #5e5e67;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 7px;
    }

    .progress-container {
      width: 100%;
      margin-top: 22px;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(
        90deg,
        #7c3aed,
        #a78bfa
      );
      border-radius: 10px;
      transition: width .8s ease;
      box-shadow: 0 0 15px rgba(124,58,237,.5);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-top: 9px;
      color: #55555d;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* CTA */

    .cta {
      margin-top: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 60px;
      padding: 0 34px;
      background: var(--white);
      color: #050505;
      text-decoration: none;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 800;
      transition: .25s ease;
    }

    .cta:hover {
      transform: translateY(-3px);
      background: var(--purple-light);
      box-shadow: 0 15px 50px rgba(124,58,237,.25);
    }

    /* DREAM WALL */

    .world-section {
      padding: 100px 0 150px;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 55px;
    }

    .section-heading h2 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(30px, 5vw, 50px);
      letter-spacing: -2px;
    }

    .section-heading p {
      color: var(--muted);
      margin-top: 14px;
    }

    /* WALL CONTROLS */

    .wall-controls {
      width: min(1000px, 100%);
      margin: 0 auto 35px;
      display: grid;
      grid-template-columns: 1fr 220px 180px;
      gap: 14px;
    }

    .wall-search,
    .wall-filter,
    .wall-sort {
      width: 100%;
      height: 52px;
      border: 1px solid var(--line);
      background: #090909;
      color: var(--white);
      border-radius: 6px;
      padding: 0 16px;
      font-family: Inter, sans-serif;
      font-size: 14px;
      outline: none;
      transition: .2s ease;
    }

    .wall-search::placeholder {
      color: #55555d;
    }

    .wall-search:focus,
    .wall-filter:focus,
    .wall-sort:focus {
      border-color: rgba(167,139,250,.7);
      box-shadow: 0 0 0 3px rgba(124,58,237,.08);
    }

    .wall-filter,
    .wall-sort {
      cursor: pointer;
    }

    .wall-filter option,
    .wall-sort option {
      background: #090909;
      color: #ffffff;
    }

    .wall-results {
      width: min(1000px, 100%);
      margin: -18px auto 25px;
      color: #666670;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* DREAM CARDS */

    .dream-wall {
      width: min(1000px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .dream-card {
      position: relative;
      border: 1px solid var(--line);
      background:
        radial-gradient(
          circle at top right,
          rgba(124,58,237,.10),
          transparent 45%
        ),
        #090909;
      padding: 24px;
      min-height: 230px;
      border-radius: 8px;
      transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
      cursor: pointer;
      opacity: 0;
      transform: translateY(10px);
      animation: dreamIn .4s ease forwards;
    }

    @keyframes dreamIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dream-card:hover {
      transform: translateY(-4px);
      border-color: rgba(167,139,250,.55);
      box-shadow: 0 18px 45px rgba(0,0,0,.22);
    }

    .dream-number {
      color: var(--purple-light);
      font-family: "Space Grotesk", sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }

    .dream-nickname {
      font-family: "Space Grotesk", sans-serif;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .dream-text {
      color: #c8c8d0;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .dream-country {
      margin-top: 20px;
      color: #777780;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .dream-socials {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .dream-socials a {
      color: var(--purple-light);
      text-decoration: none;
      font-size: 11px;
      position: relative;
      z-index: 2;
    }

    .dream-socials a:hover {
      text-decoration: underline;
    }

    .dream-view {
      position: absolute;
      right: 20px;
      bottom: 20px;
      color: #666670;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: color .2s ease;
    }

    .dream-card:hover .dream-view {
      color: var(--purple-light);
    }

    .wall-status {
      text-align: center;
      color: #666670;
      font-size: 13px;
      padding: 40px 20px;
      grid-column: 1 / -1;
    }

    .empty-wall {
      text-align: center;
      border: 1px solid var(--line);
      background: #090909;
      padding: 70px 30px;
      grid-column: 1 / -1;
      border-radius: 8px;
    }

    .empty-wall-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 25px;
      margin-bottom: 12px;
    }

    .empty-wall-text {
      color: var(--muted);
      font-size: 14px;
    }

    /* LOAD MORE */

    .load-more-wrap {
      width: min(1000px, 100%);
      margin: 32px auto 0;
      text-align: center;
    }

    .load-more-button {
      min-width: 190px;
      height: 52px;
      padding: 0 28px;
      border: 1px solid rgba(167,139,250,.35);
      background: #090909;
      color: var(--white);
      border-radius: 6px;
      font-family: Inter, sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: .2s ease;
    }

    .load-more-button:hover {
      border-color: var(--purple-light);
      color: var(--purple-light);
      transform: translateY(-2px);
    }

    .load-more-button[hidden] {
      display: none;
    }
